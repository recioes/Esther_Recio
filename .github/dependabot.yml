version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Quarentena: versões recém-publicadas são onde aparecem pacotes sequestrados (ex.: worms de
    # npm), quase sempre retirados do registro em horas ou dias. Alertas de segurança não esperam.
    cooldown:
      default-days: 7
      semver-patch-days: 3
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
